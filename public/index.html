<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#181516"><title>晚伴</title><link rel="stylesheet" href="/style.css"></head>
<body><main class="scene"><div class="glow"></div><figure class="portrait"><img id="portrait" src="/assets/portrait.png" alt="已确认的原创成年 AI 角色：黑长发、浅色吊带、暖灯背景"><video id="idle" src="/assets/idle.mp4" muted playsinline preload="none" aria-label="离线生成的静默动作预览"></video><figcaption id="visual-label" class="sr-only">原创 AI 角色 · 静态形象</figcaption></figure>
<div class="bottom"><p id="avatar-state" role="status" hidden></p><section id="conversation" hidden><p id="agent-reply"></p><button id="task-detail-open" class="task-detail-link" hidden>查看任务</button></section><div class="notice" id="notice" role="status" aria-live="polite"></div><div class="input-row"><form id="composer"><label class="sr-only" for="message">输入消息</label><input id="message" maxlength="2000" autocomplete="off" placeholder="说说你的想法，或让我处理工作区文件…"><button type="submit">发送</button></form></div><nav class="dock" aria-label="对话控制"><button id="voice" aria-label="语音尚未连接，不会申请麦克风权限">语音未接通</button><button id="voice-cancel" hidden>取消录音</button><button id="speech-stop" disabled>停止播报</button><button id="stop" disabled>停止播放</button><details id="more"><summary aria-label="打开更多功能">更多</summary><div class="more-panel"><button id="task-open">工作区</button><button id="history-open">对话记录</button><button id="status-open">连接与设置</button><button id="audio-file-open">导入短音频测试</button><input id="audio-file" type="file" accept="audio/wav,.wav" hidden><p id="voice-hint" class="voice-hint">本地语音服务检查中 · 不会自动申请麦克风</p><button id="motion">离线动作预览</button><p>AI 角色 · 仅限成年人使用<br>当前为静态照片；动作预览为缓存片段。</p></div></details><button id="text-toggle" hidden aria-expanded="true" aria-controls="composer">文字</button></nav><p id="voice-hint" class="voice-hint">语音服务检测中 · 不会自动开启麦克风</p></div>
</main>
<dialog id="task-detail" aria-labelledby="task-detail-title"><div class="drawer-head"><h2 id="task-detail-title">任务详情</h2><button id="task-detail-close" aria-label="关闭任务详情">×</button></div><div id="agent-state"></div><p id="agent-route" class="route-summary" hidden></p><div id="agent-approval"></div><div id="agent-files"></div><details id="agent-details"><summary>实际执行步骤</summary><div id="agent-events"></div></details><div class="conversation-controls"><button id="agent-cancel" hidden>取消任务</button><button id="agent-retry" hidden>重试</button></div></dialog>
<dialog id="drawer" aria-labelledby="drawer-title"><div class="drawer-head"><h2 id="drawer-title"></h2><button id="close" aria-label="关闭面板">×</button></div><div id="drawer-content"></div></dialog>
<script type="module" src="/avatar-state.js"></script><script type="module" src="/app.js"></script><script type="module" src="/voice-client.js"></script></body></html>
