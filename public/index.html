<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#181516"><title>晚间 · Companion</title><link rel="stylesheet" href="/style.css"></head>
<body><main class="scene"><div class="glow"></div><figure class="portrait"><img id="portrait" src="/assets/portrait.png" alt="已确认的原创成年 AI 角色，长黑发、浅色吊带、暖灯背景"><video id="idle" src="/assets/idle.mp4" muted playsinline preload="none" aria-label="离线生成的静默动作预览"></video><figcaption id="visual-label">原创 AI 角色 · 静态形象</figcaption></figure>
<header><a class="brand" href="/" aria-label="晚间首页"><span class="brand-mark">◒</span> 晚间 <small>COMPANION</small></a><button class="connection" id="status-open"><i></i> 本机预览 <span>↗</span></button></header>
<section class="intro"><p class="eyebrow">A LITTLE SPACE FOR YOU</p><h1>把这一刻，<br>留给自己。</h1><p class="intro-note">聊聊今天，或把脑海里的事记下来。</p><button class="quiet-link" id="task-open">写一份备忘 <span>↗</span></button></section>
<div class="bottom"><div class="notice" id="notice" role="status" aria-live="polite">对话与语音尚未连接</div><form id="composer" hidden><label class="sr-only" for="message">输入文字</label><input id="message" maxlength="2000" autocomplete="off" placeholder="写下想说的话…"><button type="submit">保存文字 ↑</button></form><nav class="dock" aria-label="互动控制"><button id="voice" aria-label="开始语音，当前未连接"><span class="icon">♩</span><span>开始语音</span></button><button id="stop" disabled><span class="icon">□</span><span>停止播放</span></button><span class="divider"></span><button id="text-toggle" aria-expanded="false" aria-controls="composer"><span class="icon">⌨</span><span>文字</span></button><button id="history-open"><span class="icon">≡</span><span>记录</span></button></nav><p class="footnote">AI 角色 · 仅限成年人使用 <button id="motion">动作预览</button></p></div>
<button id="task-pill" class="task-pill" hidden></button></main>
<dialog id="drawer" aria-labelledby="drawer-title"><div class="drawer-head"><div><p class="eyebrow" id="drawer-kicker">YOUR SPACE</p><h2 id="drawer-title"></h2></div><button id="close" aria-label="关闭面板">×</button></div><div id="drawer-content"></div></dialog>
<script type="module" src="/app.js"></script></body></html>
