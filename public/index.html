<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#181516"><title>晚伴</title><link rel="stylesheet" href="/style.css"></head>
<body><main class="scene"><div class="glow"></div><figure class="portrait"><img id="portrait" src="/assets/portrait.png" alt="已确认的原创成年 AI 角色：黑长发、浅色吊带、暖灯背景"><video id="idle" src="/assets/idle.mp4" muted playsinline preload="none" aria-label="离线生成的静默动作预览"></video><figcaption id="visual-label" class="sr-only">原创 AI 角色 · 静态形象</figcaption></figure>
<div class="bottom"><div class="notice" id="notice" role="status" aria-live="polite"></div><div class="input-row"><form id="composer"><label class="sr-only" for="message">输入消息</label><input id="message" maxlength="2000" autocomplete="off" placeholder="想说些什么…"><button type="submit">发送</button></form></div><nav class="dock" aria-label="对话控制"><button id="voice" aria-label="语音尚未连接，不会申请麦克风权限">语音</button><button id="stop" disabled>停止播放</button><details id="more"><summary aria-label="打开更多功能">更多</summary><div class="more-panel"><button id="history-open">对话记录</button><button id="task-open">文件任务</button><button id="status-open">连接与设置</button><button id="motion">离线动作预览</button><p>AI 角色 · 仅限成年人使用<br>当前为静态照片；动作预览为缓存片段。</p></div></details><button id="text-toggle" hidden aria-expanded="true" aria-controls="composer">文字</button></nav></div>
<button id="task-pill" class="task-pill" hidden></button></main>
<dialog id="drawer" aria-labelledby="drawer-title"><div class="drawer-head"><h2 id="drawer-title"></h2><button id="close" aria-label="关闭面板">×</button></div><div id="drawer-content"></div></dialog>
<script type="module" src="/app.js"></script></body></html>
