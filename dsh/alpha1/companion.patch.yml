- id: tool-web
  disabled: true

- id: session-log-deepseek
  config:
    enabled: false
- id: sandbox-policy
  config:
    mode: workspace-write
    workspaceRoot: !!js process.cwd()
- id: llm-deepseek
  config:
    apiKeyEnv: DEEPSEEK_API_KEY
    baseURL: !!js process.env.COMPANION_MODEL_BASE || 'https://api.deepseek.com'
    thinking: disabled
    streamIdleTimeoutMs: 25000
    retryPolicy:
      mode: normal
      maxRetries: 0
- id: tools
  config:
    mode: native
- id: system-prompt
  config:
    persona: >-
      You are an honest Chinese assistant. Only companion_write_note is authorized.
      Call the actual tool to save the requested note. Never claim an uncreated file exists.
- insert:
    - id: companion-bounded-note
      name: ./companion-plugin.mjs

- id: sdk-jsonrpc-server
  inject: [sdkAppStartup, loader, companionProofReady, companionJevReady]

- id: plan-mode
  disabled: true

- id: companion-jev
  config:
    timeoutMs: 8000
- insert:
    - id: companion-jev-provider
      name: ./jev-provider-bridge.mjs
